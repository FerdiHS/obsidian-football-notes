name: Sync Release Please Version Metadata

on:
    pull_request_target:
        types:
            - opened
            - reopened
            - synchronize
            - ready_for_review
        branches:
            - main

permissions:
    contents: write
    pull-requests: write

jobs:
    sync-version-metadata:
        if: >
            github.event.pull_request.base.ref == 'main' &&
            github.event.pull_request.head.repo.full_name == github.repository &&
            startsWith(github.event.pull_request.head.ref, 'release-please--branches--main') &&
            contains(github.event.pull_request.body || '', 'This PR was generated with [Release Please]')
        runs-on: ubuntu-latest
        timeout-minutes: 10

        steps:
            - name: Generate GitHub App token
              id: app-token
              uses: actions/create-github-app-token@v2
              with:
                  app-id: ${{ vars.RELEASE_PLEASE_APP_ID }}
                  private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
                  permission-contents: write
                  permission-pull-requests: write

            - uses: actions/checkout@v4
              with:
                  ref: ${{ github.event.pull_request.head.ref }}
                  token: ${{ steps.app-token.outputs.token }}
                  fetch-depth: 0

            - name: Use Node.js 20
              uses: actions/setup-node@v4
              with:
                  node-version: 20.x
                  cache: npm

            - run: npm ci
            - run: npm run version:sync
            - run: npm run version:check

            - name: Commit version metadata changes
              env:
                  BRANCH: ${{ github.event.pull_request.head.ref }}
              run: |
                  if git diff --quiet -- manifest.json versions.json; then
                    echo "No release metadata changes were needed."
                    exit 0
                  fi

                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"
                  git add manifest.json versions.json
                  git commit -m "chore: sync release metadata"
                  git push origin HEAD:"$BRANCH"
