name: Auto-merge Release Please PRs

on:
    pull_request_target:
        types:
            - opened
            - reopened
            - synchronize
            - ready_for_review
        branches:
            - main

permissions:
    contents: write
    pull-requests: write

jobs:
    auto-merge:
        if: >
            github.event.pull_request.base.ref == 'main' &&
            github.event.pull_request.head.repo.full_name == github.repository &&
            !github.event.pull_request.draft &&
            startsWith(github.event.pull_request.head.ref, 'release-please--branches--main') &&
            contains(github.event.pull_request.body || '', 'This PR was generated with [Release Please]') &&
            github.event.pull_request.user.login == 'FerdiHS'
        runs-on: ubuntu-latest
        timeout-minutes: 5

        steps:
            - name: Enable auto-merge for qualifying Release Please PR
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  PR_URL: ${{ github.event.pull_request.html_url }}
                  PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
              run: gh pr merge --auto --squash --match-head-commit "$PR_HEAD_SHA" "$PR_URL"
