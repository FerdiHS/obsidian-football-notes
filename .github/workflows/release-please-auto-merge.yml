name: Auto-merge Release Please PRs

on:
    pull_request_target:
        types:
            - opened
            - reopened
            - synchronize
            - ready_for_review
        branches:
            - main

permissions:
    contents: read

jobs:
    auto-merge:
        if: >
            github.event.pull_request.base.ref == 'main' &&
            github.event.pull_request.head.repo.full_name == github.repository &&
            !github.event.pull_request.draft &&
            startsWith(github.event.pull_request.head.ref, 'release-please--branches--main') &&
            contains(github.event.pull_request.body || '', 'This PR was generated with [Release Please]')
        runs-on: ubuntu-latest
        timeout-minutes: 5

        steps:
            - name: Generate GitHub App token
              id: app-token
              uses: actions/create-github-app-token@v2
              with:
                  app-id: ${{ vars.RELEASE_PLEASE_APP_ID }}
                  private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
                  permission-contents: write
                  permission-pull-requests: write

            - name: Enable auto-merge for qualifying Release Please PR
              if: ${{ github.event.pull_request.user.login == format('{0}[bot]', steps.app-token.outputs.app-slug) }}
              env:
                  GH_TOKEN: ${{ steps.app-token.outputs.token }}
                  PR_URL: ${{ github.event.pull_request.html_url }}
                  PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
              run: gh pr merge --auto --squash --delete-branch --match-head-commit "$PR_HEAD_SHA" "$PR_URL"
