name: Release Please Approval Gate

on:
    pull_request_target:
        types:
            - labeled
            - synchronize
            - converted_to_draft
        branches:
            - main

permissions:
    contents: read
    issues: write
    pull-requests: write

jobs:
    invalidate-stale-approval:
        name: Release Please Approval Invalidation
        if: >
            github.event.pull_request.base.ref == 'main' &&
            github.event.pull_request.head.repo.full_name == github.repository &&
            startsWith(github.event.pull_request.head.ref, 'release-please--branches--main') &&
            contains(github.event.pull_request.body || '', 'This PR was generated with [Release Please]')
        runs-on: ubuntu-latest
        timeout-minutes: 5

        steps:
            - name: Generate GitHub App token
              id: app-token
              if: >
                  (
                      github.event.action == 'synchronize' ||
                      github.event.action == 'converted_to_draft'
                  ) &&
                  contains(github.event.pull_request.labels.*.name, 'release: ready')
              uses: actions/create-github-app-token@v2
              with:
                  app-id: ${{ vars.RELEASE_PLEASE_APP_ID }}
                  private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
                  permission-contents: write
                  permission-pull-requests: write
                  permission-issues: write

            - name: Remove stale approval label
              if: >
                  (
                      github.event.action == 'synchronize' ||
                      github.event.action == 'converted_to_draft'
                  ) &&
                  contains(github.event.pull_request.labels.*.name, 'release: ready')
              env:
                  GH_TOKEN: ${{ steps.app-token.outputs.token }}
                  PR_URL: ${{ github.event.pull_request.html_url }}
              run: |
                  gh pr edit "$PR_URL" --remove-label "release: ready"

    merge-release:
        name: Release Please Merge Orchestration
        needs: invalidate-stale-approval
        if: >
            github.event.pull_request.base.ref == 'main' &&
            github.event.pull_request.head.repo.full_name == github.repository &&
            startsWith(github.event.pull_request.head.ref, 'release-please--branches--main') &&
            contains(github.event.pull_request.body || '', 'This PR was generated with [Release Please]') &&
            github.event.action == 'labeled' &&
            github.event.label.name == 'release: ready' &&
            contains(github.event.pull_request.labels.*.name, 'release: ready')
        runs-on: ubuntu-latest
        timeout-minutes: 5

        steps:
            - name: Generate GitHub App token
              id: app-token
              uses: actions/create-github-app-token@v2
              with:
                  app-id: ${{ vars.RELEASE_PLEASE_APP_ID }}
                  private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
                  permission-contents: write
                  permission-pull-requests: write
                  permission-issues: write

            - name: Validate and merge release
              env:
                  GH_TOKEN: ${{ steps.app-token.outputs.token }}
                  PR_URL: ${{ github.event.pull_request.html_url }}
                  PR_EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
                  PR_LABELER: ${{ github.actor }}
                  PR_AUTHOR: ${{ github.event.pull_request.user.login }}
                  APP_SLUG: ${{ vars.RELEASE_PLEASE_APP_SLUG }}
                  ORCHESTRATION_CHECK_NAME: Release Please Merge Orchestration
                  INVALIDATION_CHECK_NAME: Release Please Approval Invalidation
              run: |
                  set -euo pipefail

                  fail_validation() {
                    cleanup_failed=0
                    gh pr edit "$PR_URL" --remove-label "release: ready" || cleanup_failed=1
                    gh pr comment "$PR_URL" --body "$1" || cleanup_failed=1
                    if [ "$cleanup_failed" -ne 0 ]; then
                      exit 1
                    fi
                    exit 0
                  }

                  if [ "$PR_LABELER" != "FerdiHS" ]; then
                    fail_validation 'Release approval rejected: only @FerdiHS can apply `release: ready`. I removed the label.'
                  fi

                  if [ "$PR_AUTHOR" != "${APP_SLUG}[bot]" ]; then
                    fail_validation "Release approval rejected: this PR is not authored by the Release Please App. I removed the label."
                  fi

                  PR_JSON="$(gh pr view "$PR_URL" --json baseRefName,headRefOid,isDraft,statusCheckRollup)" || \
                    fail_validation "Release approval could not validate the PR. I removed the label; reapply it after fixing the issue."

                  CHECK_SUMMARY="$(jq -r --arg ORCHESTRATION_CHECK_NAME "$ORCHESTRATION_CHECK_NAME" --arg INVALIDATION_CHECK_NAME "$INVALIDATION_CHECK_NAME" '[.headRefOid, .baseRefName, (.isDraft | tostring), ([.statusCheckRollup[] | select(.name != $ORCHESTRATION_CHECK_NAME and .context != $ORCHESTRATION_CHECK_NAME and .name != $INVALIDATION_CHECK_NAME and .context != $INVALIDATION_CHECK_NAME)] | length), ([.statusCheckRollup[] | select(.name != $ORCHESTRATION_CHECK_NAME and .context != $ORCHESTRATION_CHECK_NAME and .name != $INVALIDATION_CHECK_NAME and .context != $INVALIDATION_CHECK_NAME and (((.conclusion == "SUCCESS") or (.state == "SUCCESS")) | not))] | length)] | @tsv' <<< "$PR_JSON")" || \
                    fail_validation "Release approval could not read PR checks. I removed the label; reapply it after fixing the issue."
                  read -r PR_HEAD_SHA PR_BASE PR_DRAFT EXTERNAL_CHECK_COUNT FAILED_EXTERNAL_CHECKS <<< "$CHECK_SUMMARY"

                  if [ "$PR_BASE" != "main" ]; then
                    fail_validation "Release approval rejected: the PR no longer targets main. I removed the label."
                  fi

                  if [ "$PR_DRAFT" = "true" ]; then
                    fail_validation "Release approval rejected: the PR is still a draft. I removed the label."
                  fi

                  if [ "$PR_HEAD_SHA" != "$PR_EVENT_HEAD_SHA" ]; then
                    fail_validation "Release approval rejected: the label is stale for the current commit. I removed the label."
                  fi

                  if [ "$EXTERNAL_CHECK_COUNT" -eq 0 ] || [ "$FAILED_EXTERNAL_CHECKS" -ne 0 ]; then
                    fail_validation "Release approval blocked: at least one external status check must report SUCCESS, and every external status check must be successful. I removed the label; reapply it after all checks pass."
                  fi

                  if ! gh pr merge --squash --delete-branch --match-head-commit "$PR_HEAD_SHA" "$PR_URL"; then
                    gh pr edit "$PR_URL" --remove-label "release: ready" || true
                    gh pr comment "$PR_URL" --body "Release merge failed for the validated commit. I removed the label; reapply it after fixing the issue." || true
                    exit 1
                  fi
