name: Release Please Approval Gate

on:
    pull_request_target:
        types:
            - labeled
            - unlabeled
            - synchronize
            - ready_for_review
        branches:
            - main

permissions:
    contents: read
    issues: write
    pull-requests: write

jobs:
    invalidate-stale-approval:
        if: >
            github.event.pull_request.base.ref == 'main' &&
            github.event.pull_request.head.repo.full_name == github.repository &&
            startsWith(github.event.pull_request.head.ref, 'release-please--branches--main') &&
            contains(github.event.pull_request.body || '', 'This PR was generated with [Release Please]') &&
            github.event.action == 'synchronize' &&
            contains(github.event.pull_request.labels.*.name, 'release: ready')
        runs-on: ubuntu-latest
        timeout-minutes: 5

        steps:
            - name: Generate GitHub App token
              id: app-token
              uses: actions/create-github-app-token@v2
              with:
                  app-id: ${{ vars.RELEASE_PLEASE_APP_ID }}
                  private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
                  permission-contents: write
                  permission-pull-requests: write
                  permission-issues: write

            - name: Disable auto-merge and remove stale approval label
              env:
                  GH_TOKEN: ${{ steps.app-token.outputs.token }}
                  PR_URL: ${{ github.event.pull_request.html_url }}
              run: |
                  if [ "$(gh pr view "$PR_URL" --json autoMergeRequest --jq '.autoMergeRequest != null')" = "true" ]; then
                    gh pr merge --disable-auto "$PR_URL"
                  fi

                  gh pr edit "$PR_URL" --remove-label "release: ready"

    disable-auto-merge-on-label-removal:
        if: >
            github.event.pull_request.base.ref == 'main' &&
            github.event.pull_request.head.repo.full_name == github.repository &&
            startsWith(github.event.pull_request.head.ref, 'release-please--branches--main') &&
            contains(github.event.pull_request.body || '', 'This PR was generated with [Release Please]') &&
            github.event.action == 'unlabeled' &&
            github.event.label.name == 'release: ready'
        runs-on: ubuntu-latest
        timeout-minutes: 5

        steps:
            - name: Generate GitHub App token
              id: app-token
              uses: actions/create-github-app-token@v2
              with:
                  app-id: ${{ vars.RELEASE_PLEASE_APP_ID }}
                  private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
                  permission-contents: write
                  permission-pull-requests: write
                  permission-issues: write

            - name: Disable auto-merge after approval label is removed
              env:
                  GH_TOKEN: ${{ steps.app-token.outputs.token }}
                  PR_URL: ${{ github.event.pull_request.html_url }}
              run: |
                  if [ "$(gh pr view "$PR_URL" --json autoMergeRequest --jq '.autoMergeRequest != null')" = "true" ]; then
                    gh pr merge --disable-auto "$PR_URL"
                  fi

    apply-release-approval:
        if: >
            github.event.pull_request.base.ref == 'main' &&
            github.event.pull_request.head.repo.full_name == github.repository &&
            startsWith(github.event.pull_request.head.ref, 'release-please--branches--main') &&
            contains(github.event.pull_request.body || '', 'This PR was generated with [Release Please]') &&
            contains(github.event.pull_request.labels.*.name, 'release: ready') &&
            github.event.action != 'synchronize' &&
            (
                github.event.action == 'ready_for_review' ||
                (
                    github.event.action == 'labeled' &&
                    github.event.label.name == 'release: ready'
                )
            )
        runs-on: ubuntu-latest
        timeout-minutes: 5

        steps:
            - name: Generate GitHub App token
              id: app-token
              uses: actions/create-github-app-token@v2
              with:
                  app-id: ${{ vars.RELEASE_PLEASE_APP_ID }}
                  private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
                  permission-contents: write
                  permission-pull-requests: write
                  permission-issues: write

            - name: Apply release approval
              env:
                  GH_TOKEN: ${{ steps.app-token.outputs.token }}
                  PR_URL: ${{ github.event.pull_request.html_url }}
                  PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
                  PR_ACTION: ${{ github.event.action }}
                  PR_LABELER: ${{ github.actor }}
              run: |
                  if [ "$PR_ACTION" = "labeled" ] && [ "$PR_LABELER" != "FerdiHS" ]; then
                    if [ "$(gh pr view "$PR_URL" --json autoMergeRequest --jq '.autoMergeRequest != null')" = "true" ]; then
                      gh pr merge --disable-auto "$PR_URL"
                    fi

                    gh pr edit "$PR_URL" --remove-label "release: ready"
                    gh pr comment "$PR_URL" --body "Only @FerdiHS can apply \`release: ready\` to Release Please PRs. I removed the label and disabled auto-merge."
                    exit 0
                  fi

                  gh pr merge --auto --squash --delete-branch --match-head-commit "$PR_HEAD_SHA" "$PR_URL"
